name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - uses: actions/checkout@v7

      - name: Instalar JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Cache de Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compilar y testear
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Publicar el jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: codequest-backend
          path: backend/target/codequest-*.jar
          if-no-files-found: error

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Compilar
        working-directory: frontend
        run: npm run build

      - name: Comprobar el formato
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,html,scss}"

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build de la imagen del backend
        run: docker build -f backend/Dockerfile -t codequest-backend:ci .

      - name: Build de la imagen del frontend
        run: docker build -f frontend/Dockerfile -t codequest-frontend:ci .

      - name: Comprobar que el backend arranca en la imagen
        run: |
          docker run -d --name codequest-ci -p 8080:8080 codequest-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "El backend responde correctamente"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no arranco a tiempo"
          docker logs codequest-ci
          exit 1
