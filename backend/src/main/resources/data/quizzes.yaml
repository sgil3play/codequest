- id: design-006
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, dip]
  xp: 10
  question: |
    Principio de Inversion de Dependencias (DIP)?
  options:
    - Depender de implementaciones concretas
    - Depender de abstracciones, no de implementaciones concretas
    - Crear nuevas instancias directamente
    - Usar solo clases estaticas
