- id: testing-001
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, unit, integration]
  xp: 10
  question: |
    Diferencia entre test unitario y test de integracion?
  options:
    - Unitario prueba una unidad aislada (con mocks), integracion prueba varias capas juntas
    - Son iguales
    - Unitario siempre usa BD
    - Integracion solo prueba UI
  correctIndex: 0
  explanation: |
    Los tests unitarios aislan la unidad bajo test. Los de integracion verifican
    la interaccion entre componentes reales o con infraestructura.

- id: testing-002
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, mocks, stubs]
  xp: 10
  question: |
    Diferencia entre mock y stub?
  options:
    - Stub proporciona respuestas predefinidas; Mock verifica comportamiento/interacciones
    - Son lo mismo
    - Mock solo para BD
    - Stub es mas moderno
  correctIndex: 1
  explanation: |
    Stub = estado (responde). Mock = comportamiento (verifica que se llamo
    con ciertos parametros, numero de veces, etc.)

- id: testing-003
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, pyramid]
  xp: 10
  question: |
    Que propone la piramide de testing?
  options:
    - Muchos E2E, pocos unitarios
    - Mas tests unitarios, menos integracion, aun menos E2E
    - Solo tests E2E
    - Igual cantidad de todos
  correctIndex: 1
  explanation: |
    La piramide prioriza tests rapidos, baratos y aislados (unitarios) sobre
    tests lentos y costosos (E2E).

- id: testing-004
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, first-principles, f.i.r.s.t]
  xp: 10
  question: |
    Que significa FIRST en testing?
  options:
    - Fast, Independent, Repeatable, Self-validating, Timely
    - First In Run System Test
    - Fake, Isolated, Random, Safe, Tested
    - None
  correctIndex: 0
  explanation: |
    FIRST define buenas caracteristicas: rapidos, independientes, repetibles,
    auto-validables, oportunos.

- id: testing-005
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, coverage]
  xp: 10
  question: |
    Es suficiente tener 100% de coverage para garantizar calidad?
  options:
    - Si, siempre
    - No, el coverage mide lineas ejecutadas, no la calidad de las aserciones
    - Solo si son tests unitarios
    - En Java si es obligatorio
  correctIndex: 1
  explanation: |
    Alto coverage no implica tests buenos. Lo importante es probar casos criticos,
    bordes y comportamiento, no solo ejecutar codigo.

- id: testing-006
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, tdd, outside-in]
  xp: 10
  question: |
    Cual es la diferencia entre TDD clasico (inside-out) y outside-in?
  options:
    - No hay diferencia
    - Inside-out empieza por dominio, outside-in empieza por la interfaz/controlador
    - Outside-in solo para frontend
    - Inside-out no usa mocks
  correctIndex: 1
  explanation: |
    Outside-in (ATDD/BDD) parte de la aceptacion del usuario y baja; inside-out
    parte del nucleo de dominio hacia fuera.

- id: testing-007
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, contract]
  xp: 10
  question: |
    Para que sirven los contract tests?
  options:
    - Para probar contratos entre consumidor y proveedor (evitar breaking changes)
    - Para testear CSS
    - Para generar DTOs
    - Para validar YAML
  correctIndex: 0
  explanation: |
    Pact y herramientas similares verifican que proveedor cumple lo que consumidor
    espera, ideal en arquitecturas de microservicios.

- id: testing-008
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, testcontainers]
  xp: 10
  question: |
    Que aporta Testcontainers?
  options:
    - Simula contenedores en memoria
    - Levanta contenedores reales (DB, Kafka) para tests de integracion
    - Genera mocks automaticos
    - Compila mas rapido
  correctIndex: 1
  explanation: |
    Testcontainers permite usar infraestructura real en tests aislados, aumentando
    la fiabilidad frente a mocks.

- id: testing-009
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, mutation]
  xp: 10
  question: |
    Que es mutation testing?
  options:
    - Cambiar el codigo de test
    - Introducir mutaciones en el codigo y ver si los tests las detectan
    - Mutar la BD
    - Ninguna
  correctIndex: 1
  explanation: |
    Mutation testing evalua la efectividad de los tests: si una mutacion sobrevive,
