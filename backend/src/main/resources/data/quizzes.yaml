- id: spring-boot-010
  topic: Spring Boot
  track: SPRING_BOOT
  difficulty: MEDIUM
  tags: [spring-boot, configuration, properties]
  xp: 10
  question: |
    Cual es la diferencia entre `@Value` y `@ConfigurationProperties`?
  options:
    - Son identicos
    - '`@Value` inyecta valores individuales, `@ConfigurationProperties` vincula
      grupos de propiedades a un POJO tipado'
    - '`@ConfigurationProperties` solo funciona con YAML'
    - '`@Value` no soporta valores por defecto'
  correctIndex: 1
  explanation: |
    `@Value` es mas granular para propiedades sueltas. `@ConfigurationProperties`
    ofrece binding tipado, validacion con `@Validated` y mejor estructura.

- id: jpa-001
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, entity, lifecycle]
  xp: 10
  question: |
    Cuales son los estados del ciclo de vida de una entidad JPA?
  options:
    - NEW, MANAGED, DETACHED, REMOVED
    - CREATE, READ, UPDATE, DELETE
    - OPEN, PERSIST, CLOSE, FLUSH
    - ATTACHED, LOADED, SAVED, DELETED
  correctIndex: 0
  explanation: |
    Los estados son Transient (NEW), Managed, Detached y Removed. EntityManager
    transiciona entre ellos con persist, merge, remove, detach, clear.

- id: jpa-002
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, fetch, lazy-eager]
  xp: 10
  question: |
    Diferencia entre fetch LAZY y EAGER?
  options:
    - LAZY carga siempre, EAGER solo bajo demanda
    - EAGER carga la relacion inmediatamente, LAZY carga bajo demanda
    - Ambas son iguales en Hibernate
    - LAZY solo funciona con @OneToOne
  correctIndex: 1
  explanation: |
    EAGER hace un fetch inmediato (puede causar JOINs). LAZY usa proxy y carga
    cuando se accede (riesgo de LazyInitializationException fuera de transaccion).

- id: jpa-003
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, cascade, orphanRemoval]
  xp: 10
  question: |
    Para que sirve orphanRemoval = true?
  options:
    - Elimina la entidad padre
    - Elimina entidades hijo huerfanas al quitarlas de la coleccion
    - Hace un borrado en cascada automatico
    - Desactiva el lazy loading
  correctIndex: 1
  explanation: |
    Cuando se elimina un elemento de una coleccion y orphanRemoval=true, Hibernate
    lo borra de la BD. Es distinto de CascadeType.REMOVE.

- id: jpa-004
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, relations, mappedBy]
  xp: 10
  question: |
    En una relacion bidireccional @OneToMany/@ManyToOne, que indica mappedBy?
  options:
    - Que lado es el propietario de la relacion
    - Que lado NO es el propietario (el inverso)
    - Que se debe usar eager loading
    - Que se crea un join table
  correctIndex: 1
  explanation: |
    mappedBy indica el campo del lado propietario. Solo el lado propietario
    gestiona la clave foranea. Es importante mantener la coherencia en ambos lados.

- id: jpa-005
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, queries, jpql]
  xp: 10
  question: |
    Cual es la ventaja de usar DTO projections en lugar de entidades?
  options:
    - Siempre es mas lento
    - Trae solo los campos necesarios, menor carga y evita problemas lazy
    - Obliga a usar native queries
    - Desactiva el cache
  correctIndex: 1
  explanation: |
    Las proyecciones (constructor expression, interface-based) reducen el volumen
    de datos, evitan cargar relaciones y son mas eficientes para lecturas.

- id: jpa-006
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, locking, pessimist-optimist]
  xp: 10
  question: |
    Diferencia entre bloqueo optimista y pesimista?
  options:
    - Optmistico usa @Version y comprueba al flush, pesimista bloquea la fila con SELECT ... FOR UPDATE
    - Son lo mismo
    - Pesimista solo funciona con MySQL
    - Optmistico requiere Redis
  correctIndex: 0
  explanation: |
    Con @Version y OptimisticLocking se detecta conflicto al hacer commit. Con
    LockModeType.PESSIMISTIC_WRITE se bloquea la fila para evitar conflictos.

- id: jpa-007
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, cache, l1-l2]
  xp: 10
  question: |
    Cual es la diferencia entre el cache de primer nivel y segundo nivel?
  options:
    - Solo hay un cache
    - Primer nivel es por EntityManager/sesion, segundo nivel es por SessionFactory/contexto
    - Segundo nivel es por transaccion
    - Primer nivel usa Redis
  correctIndex: 1
  explanation: |
    L1 es obligatorio y scope por EntityManager. L2 es opcional, compartido entre
    sesiones, requiere configuracion y entidades cacheables.

- id: jpa-008
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, entitygraph, fetch]
  xp: 10
  question: |
    Para que sirve @EntityGraph?
  options:
    - Para crear graficos UML
    - Para definir fetch plans dinamicos y evitar N+1
    - Para validar entidades
    - Para mapear a JSON
  correctIndex: 1
  explanation: |
    @EntityGraph permite especificar que atributos/relaciones cargar eager en
    una consulta concreta sin cambiar el fetch por defecto de la entidad.

- id: jpa-009
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, flush, persistence-context]
  xp: 10
  question: |
    Que hace flush() en un EntityManager?
  options:
    - Cierra la sesion
    - Sincroniza el contexto de persistencia con la BD (envia SQL)
    - Elimina todas las entidades
    - Hace rollback
  correctIndex: 1
  explanation: |
    flush() fuerza el envio de las operaciones pendientes al DB (INSERT/UPDATE/DELETE)
    sin hacer commit. El commit llama a flush() implicitamente.

- id: jpa-010
  topic: JPA / Hibernate
  track: JPA
  difficulty: MEDIUM
  tags: [jpa, merge, detached]
  xp: 10
  question: |
    Cuando usar merge() frente a managed entities?
  options:
    - Siempre usar persist()
    - merge() copia el estado de una entidad detached a una entidad managed
    - merge() elimina la entidad
    - merge() solo funciona con @Id auto
  correctIndex: 1
  explanation: |
    Si la entidad esta detached (fuera del contexto), merge() la vuelve a gestionar
    devolviendo una instancia managed o actualizando la existente.

- id: sql-003
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, group-by, having]
  xp: 10
  question: |
    Cual es la diferencia entre WHERE y HAVING?
  options:
    - WHERE filtra filas antes de agrupar, HAVING filtra grupos despues de GROUP BY
    - Son equivalentes
    - HAVING solo funciona sin GROUP BY
    - WHERE solo funciona con agregados
  correctIndex: 0
  explanation: |
    WHERE se aplica a filas individuales. HAVING se aplica tras la agregacion
    para filtrar grupos usando funciones agregadas.

- id: sql-004
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, union, union-all]
  xp: 10
  question: |
    Diferencia entre UNION y UNION ALL?
  options:
    - UNION ALL elimina duplicados, UNION los mantiene
    - UNION elimina duplicados y ordena, UNION ALL no elimina duplicados (mas rapido)
    - Son identicos
    - UNION solo funciona con dos consultas
  correctIndex: 1
  explanation: |
    UNION ALL es mas eficiente al no hacer DISTINCT. UNION hace UNION ALL + DISTINCT.

- id: sql-005
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, subquery, exists]
  xp: 10
  question: |
    Cuando es preferible usar EXISTS en lugar de IN con subconsulta?
  options:
    - Siempre
    - EXISTS suele ser mejor con subconsultas correlacionadas y valores NULL
    - IN es siempre mas rapido
    - Solo en Oracle
  correctIndex: 1
  explanation: |
    EXISTS deja de evaluar al encontrar la primera fila coincidente. IN puede
    tener problemas con NULL y ser menos eficiente en ciertos casos.

- id: sql-006
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, indexes, explain]
  xp: 10
  question: |
    Por que un indice puede no usarse en una consulta?
  options:
    - Nunca ocurre
    - Si se aplica una funcion sobre la columna indexada en el WHERE
    - Solo con tablas vacias
    - Si la tabla tiene menos de 1000 filas
  correctIndex: 1
  explanation: |
    Funciones, conversiones implicitas o uso de LIKE con % inicial impiden el uso
    del indice. Es importante revisar el plan de ejecucion (EXPLAIN PLAN).

- id: sql-007
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, transactions, isolation]
  xp: 10
  question: |
    Que es una transaccion ACID?
  options:
    - Automatic Commit In Database
    - Atomicidad, Consistencia, Aislamiento, Durabilidad
    - Asynchronous Commit Interface Definition
    - None of the above
  correctIndex: 1
  explanation: |
    ACID garantiza transacciones fiables: Atomicity, Consistency, Isolation, Durability.

- id: sql-008
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, rownum, pagination]
  xp: 10
  question: |
    Como hacer paginacion eficiente en Oracle/SQL?
  options:
    - Con ROWNUM sin ordenacion
    - Con ORDER BY + ROW_NUMBER() OVER() o FETCH FIRST/LIMIT segun BD
    - Cargando toda la tabla
    - Con COUNT(*) sin indices
  correctIndex: 1
  explanation: |
    Es fundamental ordenar antes de paginar. ROW_NUMBER() o FETCH FIRST ... OFFSET
    son las formas correctas y eficientes.

- id: sql-009
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, normalizacion]
  xp: 10
  question: |
    Cual es el objetivo de la normalizacion?
  options:
    - Duplicar datos
    - Reducir redundancia y evitar anomalias de actualizacion
    - Hacer las tablas mas grandes
    - Eliminar todos los NULL
  correctIndex: 1
  explanation: |
    La normalizacion minimiza redundancia y dependencias, previniendo anomalias
    en INSERT/UPDATE/DELETE.

- id: sql-010
  topic: SQL y Oracle
  track: SQL
  difficulty: MEDIUM
  tags: [sql, keys, constraints]
  xp: 10
  question: |
    Diferencia entre clave primaria y clave candidata?
  options:
    - No hay diferencia
    - Clave candidata es un candidato a PK; la PK es la elegida, puede haber varias candidatas
    - Solo hay PK
    - Clave candidata siempre es compuesta
  correctIndex: 1
  explanation: |
    Una tabla puede tener varias claves candidatas (UNIQUE NOT NULL). Se elige
    una como clave primaria; las demas siguen siendo candidatas.

- id: rest-001
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, http, methods]
  xp: 10
  question: |
    Que significa que HTTP sea stateless?
  options:
    - El servidor guarda la sesion siempre
    - Cada peticion debe contener toda la informacion necesaria, sin contexto de sesion
    - Las peticiones son aleatorias
    - No se pueden usar cookies
  correctIndex: 1
  explanation: |
    Stateless implica que cada request es independiente. La autenticacion se envia
    en cada peticion (tokens, etc.) sin depender de sesion en servidor.

- id: rest-002
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, http, status]
  xp: 10
  question: |
    Que codigo HTTP usar para crear un recurso?
  options:
    - 200 OK
    - 201 Created
    - 204 No Content
    - 202 Accepted
  correctIndex: 1
  explanation: |
    201 Created indica que se ha creado el recurso. Suele incluir Location header.

- id: rest-003
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, http, status]
  xp: 10
  question: |
    Cuando usar 204 No Content?
  options:
    - Al crear un recurso
    - Cuando la operacion tiene exito pero no hay cuerpo de respuesta
    - Para errores
    - Para redirecciones
  correctIndex: 1
  explanation: |
    204 No Content es adecuado para operaciones exitosas sin retorno, como DELETE
    o PUT/PATCH sin cuerpo de respuesta.

- id: rest-004
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, http, idempotent]
  xp: 10
  question: |
    Cuales de estos metodos HTTP son idempotentes?
  options:
    - POST siempre
    - GET, PUT, DELETE son idempotentes; POST no lo es
    - Solo GET
    - Todos son idempotentes
  correctIndex: 1
  explanation: |
    Idempotente = misma peticion multiples veces produce mismo efecto. GET/PUT/DELETE
    lo son (con matices). POST no es idempotente por naturaleza.

- id: rest-005
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, http, safe]
  xp: 10
  question: |
    Que metodos HTTP son seguros (safe)?
  options:
    - GET y HEAD no modifican el recurso
    - POST y PUT
    - DELETE
    - PATCH
  correctIndex: 0
  explanation: |
    GET, HEAD, OPTIONS son seguros: no tienen efectos secundarios en el servidor.

- id: rest-006
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, versioning]
  xp: 10
  question: |
    Formas comunes de versionar una API REST?
  options:
