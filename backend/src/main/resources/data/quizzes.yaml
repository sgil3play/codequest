    - Usar page/size con enlaces next/prev/first/last
    - Usar solo offset
    - No paginar nunca
  correctIndex: 1
  explanation: |
    Es mejor devolver metadatos (total, page, size) y links HATEOAS para navegar.

- id: rest-010
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, errors, rfc7807]
  xp: 10
  question: |
