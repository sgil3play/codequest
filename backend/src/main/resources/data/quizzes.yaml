    - 'URI (/v1/...), header (Accept: application/vnd...), query param'
    - No es necesario versionar
    - Unicamente con cookies
  correctIndex: 1
  explanation: |
    Las mas comunes: versionado por URI, por header personalizado o media type,
    o por query parameter. Cada una tiene pros/contras.

- id: rest-007
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, hateoas]
  xp: 10
  question: |
    Que es HATEOAS?
  options:
    - Hypermedia as the Engine of Application State
    - Un tipo de autenticacion
    - Un formato de compresion
    - Un protocolo SOAP
  correctIndex: 0
  explanation: |
    HATEOAS permite descubrir acciones disponibles a traves de hipermedia links,
    haciendo la API mas auto-descubrible.

- id: rest-008
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, content-negotiation]
  xp: 10
  question: |
    Que es la negociacion de contenido?
  options:
    - Negociar precio
    - Cliente y servidor acuerdan formato (Accept/Content-Type)
    - Negociar certificados SSL
    - Ninguna de las anteriores
  correctIndex: 1
  explanation: |
    Mediante headers Accept (cliente acepta) y Content-Type (formato enviado)
    se negocia el formato de representacion.

- id: rest-009
  topic: REST
  track: REST
  difficulty: MEDIUM
  tags: [rest, pagination, filtering]
  xp: 10
  question: |
    Buenas practicas para paginacion en REST?
  options:
