- id: testing-010
  topic: Testing
  track: TESTING
  difficulty: MEDIUM
  tags: [testing, arrange-act-assert]
  xp: 10
  question: |
    Que estructura sigue Arrange-Act-Assert?
  options:
    - Preparar, ejecutar, verificar
    - Compilar, ejecutar, desplegar
    - Crear, leer, borrar
    - Setup, run, report
  correctIndex: 0
  explanation: |
    AAA organiza el test claramente: Arrange (preparar), Act (ejecutar), Assert (verificar).

- id: design-001
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, principles]
  xp: 10
  question: |
    Que significa SOLID?
  options:
    - Single responsibility, Open-closed, Liskov substitution, Interface segregation, Dependency inversion
    - Simple Object Layer Integration Design
    - Systematic Object Logic Implementation Doctrine
    - None
  correctIndex: 0
  explanation: |
    Los principios SOLID ayudan a crear sistemas mantenibles, extensibles y flexibles.

- id: design-002
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, srp]
  xp: 10
  question: |
    Principio de Responsabilidad unica (SRP)?
  options:
    - Una clase debe tener mas de 1 responsabilidad
    - Una clase debe tener una unica razon para cambiar
    - Debe tener multiples interfaces
    - Debe ser abstracta
  correctIndex: 1
  explanation: |
    SRP: cada clase/modulo debe tener una sola responsabilidad y una unica razon
    para cambiar.

- id: design-003
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, ocp]
  xp: 10
  question: |
    Principio Abierto/Cerrado (OCP)?
  options:
    - Abierto para modificacion, cerrado para extension
    - Cerrado para modificacion, abierto para extension
    - Siempre abierto
    - Siempre cerrado
  correctIndex: 1
  explanation: |
    Debemos poder anadir nuevo comportamiento sin modificar codigo existente,
    usando abstracciones/polimorfismo.

- id: design-004
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, lsp]
  xp: 10
  question: |
    Principio de Sustitucion de Liskov (LSP)?
  options:
    - Las clases hijas deben poder sustituir a las clases padre sin romper la logica
    - Las clases deben ser finales
    - Solo se puede heredar una vez
    - No usar herencia
  correctIndex: 1
  explanation: |
    Los subtipos deben ser sustituibles por sus tipos base sin alterar la
    correctitud del programa.

- id: design-005
  topic: Diseno de sistemas
  track: DESIGN
  difficulty: MEDIUM
  tags: [solid, isp]
  xp: 10
  question: |
    Principio de Segregacion de Interfaces (ISP)?
  options:
    - Mejor tener interfaces grandes y unicas
    - Mejor tener muchas interfaces pequenas y especificas
    - No usar interfaces
    - Solo una interface por clase
  correctIndex: 1
  explanation: |
