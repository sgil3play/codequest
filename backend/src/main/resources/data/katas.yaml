- id: java-records-001
  track: JAVA_CORE
  title: Record inmutable con validacion
  difficulty: EASY
  tags: [records, inmutabilidad, validacion, java17]
  xp: 10
  estimatedMinutes: 10
  timeLimitSeconds: 5
  solutionClass: Pedido
  testClass: PedidoTest
  prompt: |
    Java 16 introdujo los `record`: una clase inmutable con acceso por accessor,
    `equals`, `hashCode` y `toString` generados.

    Un record no es automaticamente inmutable si guarda referencias mutables:
    si el componente es una `List`, el constructor debe copiarla para que nadie
    pueda modificarla por fuera.

    Tu tarea:
      1. Valida en el constructor compacto que `codigo` no sea null ni este en blanco.
      2. Guarda `articulos` en una lista inmutable.
      3. Implementa `numeroArticulos()`.
      4. Implementa `esUrgente()`: true si el total supera 1000.
  functionSignature: |
    public record Pedido(String codigo, String cliente, List<String> articulos, double total)
  starterCode: |
    import java.util.List;

    /**
     * Pedido de la tienda. Inmutable: sus componentes no pueden cambiar.
     */
    public record Pedido(String codigo, String cliente, List<String> articulos, double total) {

        public Pedido {
            // TODO 1: si codigo es null o esta en blanco, lanza IllegalArgumentException
            // TODO 2: guarda articulos en una lista inmutable (List.copyOf)
        }

        // TODO 3: numero de articulos del pedido
        public int numeroArticulos() {
            throw new UnsupportedOperationException("TODO");
        }

        // TODO 4: un pedido es urgente cuando su total supera 1000
        public boolean esUrgente() {
            throw new UnsupportedOperationException("TODO");
        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertFalse;
    import static org.junit.jupiter.api.Assertions.assertThrows;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import java.util.ArrayList;
    import java.util.List;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class PedidoTest {

        @Test
        @DisplayName("Los componentes se leen con el accessor generado")
        void accessors() {
            Pedido pedido = new Pedido("P-1", "Ana", List.of("teclado"), 50.0);
            assertEquals("P-1", pedido.codigo());
            assertEquals("Ana", pedido.cliente());
            assertEquals(50.0, pedido.total());
        }

        @Test
        @DisplayName("El codigo es obligatorio")
        void codigoObligatorio() {
            assertThrows(IllegalArgumentException.class, () -> new Pedido(" ", "Ana", List.of(), 10.0));
            assertThrows(IllegalArgumentException.class, () -> new Pedido(null, "Ana", List.of(), 10.0));
        }

        @Test
        @DisplayName("La lista de articulos queda defendida: mutar la original no afecta al pedido")
        void listaDefensiva() {
            List<String> articulos = new ArrayList<>(List.of("raton"));
            Pedido pedido = new Pedido("P-2", "Ana", articulos, 10.0);
            articulos.add("monitor");
            assertEquals(1, pedido.articulos().size());
        }

        @Test
        @DisplayName("numeroArticulos devuelve el tamano de la lista")
        void numeroArticulos() {
            assertEquals(0, new Pedido("P-3", "Ana", List.of(), 0).numeroArticulos());
            assertEquals(2, new Pedido("P-4", "Ana", List.of("a", "b"), 0).numeroArticulos());
        }

        @Test
        @DisplayName("esUrgente solo es true por encima de 1000")
        void esUrgente() {
            assertFalse(new Pedido("P-5", "Ana", List.of(), 1000).esUrgente());
            assertTrue(new Pedido("P-6", "Ana", List.of(), 1000.01).esUrgente());
        }
    }
  explanation: |
    **La idea clave**: un `record` da inmutabilidad *superficial*. Si el componente
    es una referencia mutable, la inmutabilidad se rompe. Por eso el constructor
    compacto debe hacer `articulos = List.copyOf(articulos)`.

    En un record el constructor compacto se escribe sin parametros y sin `this`:
    basta con reasignar el parametro para que el valor se guarde.

    Alternativa habitual en entidades JPA: los `record` no son compatibles con
    Hibernate sin soporte extra, asi que en el proyecto real usarias una clase con
    `@Entity` y los `record` solo en el dominio que no se persiste.

- id: java-sealed-001
  track: JAVA_CORE
  title: Interfaces selladas y pattern matching exhaustivo
  difficulty: MEDIUM
  tags: [sealed, pattern-matching, switch, java17]
  xp: 20
  estimatedMinutes: 20
  timeLimitSeconds: 5
  solutionClass: Solution
  testClass: SolutionTest
  prompt: |
    Las interfaces `sealed` restringen quien puede implementarlas. Con eso, un
    `switch` sobre el tipo puede ser **exhaustivo**: si manana anades un nuevo
    `record` a la jerarquia, el compilador te obliga a tratarlo.

    Tu tarea es implementar `describir(Operacion, double, double)` con un `switch`
    con pattern matching (`case Suma s -> ...`) que no tenga `default`, de forma
    que el compilador se asegure de que todos los casos posibles estan cubiertos.

    El formato esperado es `"3.0 + 4.0 = 7.0"`.
  functionSignature: |
    public String describir(Operacion op, double a, double b)
  starterCode: |
    /**
     * Operaciones soportadas. `sealed` limita las implementaciones posibles,
     * lo que permite un switch exhaustivo.
     */
    sealed interface Operacion permits Suma, Resta {
        double evaluar(double a, double b);
    }

    record Suma() implements Operacion {
        @Override
        public double evaluar(double a, double b) {
            return a + b;
        }
    }

    record Resta() implements Operacion {
        @Override
        public double evaluar(double a, double b) {
            return a - b;
        }
    }

    public class Solution {

        /**
         * TODO: implementa con switch + pattern matching, exhaustivo y sin default.
         * Formato: "3.0 + 4.0 = 7.0" para Suma, "3.0 - 4.0 = -1.0" para Resta.
         */
        public String describir(Operacion op, double a, double b) {
            throw new UnsupportedOperationException("TODO");
        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;

    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        @Test
        @DisplayName("Describe una suma")
        void suma() {
            assertEquals("3.0 + 4.0 = 7.0", new Solution().describir(new Suma(), 3, 4));
        }

        @Test
        @DisplayName("Describe una resta")
        void resta() {
            assertEquals("3.0 - 4.0 = -1.0", new Solution().describir(new Resta(), 3, 4));
        }

        @Test
        @DisplayName("La operacion se evalua con los operandos recibidos")
        void operandos() {
            assertEquals("10.5 + 0.5 = 11.0", new Solution().describir(new Suma(), 10.5, 0.5));
        }
    }
  explanation: |
    `sealed interface Operacion permits Suma, Resta` define una jerarquia cerrada.
    El compilador sabe exactamente quais son las implementaciones, asi que un
    `switch` con pattern matching sobre el tipo se considera exhaustivo **sin
    `default`**. Si anades `record Multiplicacion`, el `switch` deja de compilar
    hasta que lo trates: eso es justo el valor de `sealed` frente a un
    `interface` normal.

    La sintaxis es `case Suma s -> ...`, donde `s` es la variable de patron. Si no
    necesitas el valor, `case Suma -> ...` tambien vale.

    **Por que importa en produccion**: en un dominio con muchos estados, un
    `switch` exhaustivo sobre `sealed` convierte "me he olvidado un caso" de un
    bug en tiempo de ejecucion en un error de compilacion.

