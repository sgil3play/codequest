            throw new UnsupportedOperationException("TODO");
        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;

    import java.util.List;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        private final Solution solution = new Solution();

        @Test
        @DisplayName("Suma el total de los pedidos del cliente")
        void total() {
            PedidoRepository repo = new PedidoRepositoryInMemory(List.of(
                    new Pedido("1", "Ana", 100.0),
                    new Pedido("2", "Ana", 50.0),
                    new Pedido("3", "Luis", 999.0)));
            assertEquals(150.0, solution.totalFacturado("Ana", repo));
        }

        @Test
        @DisplayName("Un cliente sin pedidos factura cero")
        void sinPedidos() {
            PedidoRepository repo = new PedidoRepositoryInMemory(List.of());
            assertEquals(0.0, solution.totalFacturado("Ana", repo));
        }

        @Test
        @DisplayName("El servicio funciona con cualquier implementacion del puerto")
        void otroAdaptador() {
            PedidoRepository repo = new PedidoRepositoryInMemory(List.of(
                    new Pedido("1", "Ana", 10.0),
                    new Pedido("2", "Ana", 20.0)));
            assertEquals(30.0, solution.totalFacturado("Ana", repo));
        }
    }
  explanation: |
    La arquitectura hexagonal (Ports & Adapters) de Alistair Cockburn se resume en
    una frase: **el dominio define las interfaces, la infraestructura las
    implementa**.

    Reglas practicas:
      - El dominio no importa nada de frameworks. Ni Spring, ni JPA, ni `java.sql`.
      - Los DTOs de entrada (lo que llega del exterior) y los de salida (lo que
        sale) son **distintos** de las entidades de dominio. Es lo que evita el
        acoplamiento a nivel de base de datos.
      - El caso de uso (servicio de aplicacion) orquesta: pide datos al puerto,
        aplica la logica, devuelve un DTO.

    En Spring, el adaptador JPA se implementa como un bean que implementa el
    puerto, y el caso de uso lo recibe por constructor. La traduccion
    DTO <-> entidad se hace con un mapper.

    **En interviews**: esta es exactamente la pregunta "explicame como
    estructurarias un proyecto para que sea mantenible". Decir "hexagonal" sin
    saber explicar el sentido de la flecha de dependencias no sirve de nada.
