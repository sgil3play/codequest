  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertInstanceOf;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import java.util.List;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        private final Solution solution = new Solution();

        @Test
        @DisplayName("estrategiaPara devuelve la estrategia segun el flag")
        void estrategia() {
            assertInstanceOf(TarifaNormal.class, solution.estrategiaPara(false));
            assertInstanceOf(TarifaUrgente.class, solution.estrategiaPara(true));
        }

        @Test
        @DisplayName("calcular aplica la estrategia que recibe")
        void calcular() {
            assertEquals(1000.0, solution.calcular(new TarifaNormal(), 10, 100.0));
            assertEquals(1500.0, solution.calcular(new TarifaUrgente(), 10, 100.0));
        }

        @Test
        @DisplayName("importeTotal suma todas las horas")
        void importeTotal() {
            assertEquals(300.0, solution.importeTotal(List.of(1, 2), 100.0, false));
            assertEquals(450.0, solution.importeTotal(List.of(1, 2), 100.0, true));
            assertEquals(0.0, solution.importeTotal(List.of(), 100.0, true));
        }

        @Test
        @DisplayName("Una estrategia nueva se puede usar sin tocar Solution")
        void estrategiaExtendible() {
            Tarifa inventada = (horas, base) -> 42.0;
            assertTrue(solution.calcular(inventada, 1, 1.0) == 42.0);
        }
    }
  explanation: |
    *Strategy* vs un simple `if` en el cliente: con el `if`, cada nuevo algoritmo
    obliga a tocar el codigo que llama; con *Strategy*, solo se anade una clase
    nueva. Eso es *Open/Closed*.

    La prueba de que el diseno es correcto esta en el ultimo test: una lambda
    implementa `Tarifa` sin tocar `Solution`. Si el test compila, la abstraccion
    es real; si no, el patron estaba decorativo.

    En Spring el equivalente habitual es inyectar una lista de beans
    (`List<Tarifa>`) y seleccionar por un criterio, o registrar las estrategias
    en un mapa.

