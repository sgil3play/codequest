    Tu tarea es construir una sentencia `INSERT` parametrizada usando un text
    block y `String.formatted`.
  functionSignature: |
    String sentenciaInsert(String tabla, List<String> columnas, List<?> valores)
  starterCode: |
    import java.util.List;

    public class Solution {

        /**
         * TODO: construye "INSERT INTO tabla (col1, col2) VALUES (?, ?)" usando
         * un text block y formatted. Los valores SIEMPRE van como parametro
         * (?), nunca interpolados: es la unica forma segura contra inyeccion SQL.
         */
        public String sentenciaInsert(String tabla, List<String> columnas, List<?> valores) {
            throw new UnsupportedOperationException("TODO");
        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import java.util.List;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        private final Solution solution = new Solution();

        @Test
        @DisplayName("Construye la sentencia con los valores como parametros")
        void sentencia() {
            String sql = solution.sentenciaInsert("pedidos",
                    List.of("codigo", "cliente"),
                    List.of("P-1", "Ana"));
            assertTrue(sql.startsWith("INSERT INTO pedidos (codigo, cliente)"), sql);
            assertTrue(sql.contains("VALUES (?, ?)"), sql);
        }

        @Test
        @DisplayName("No interpola el valor: aparece como interrogante")
        void sinInyeccion() {
            String sql = solution.sentenciaInsert("pedidos", List.of("cliente"), List.of("'; DROP TABLE pedidos; --"));
            assertTrue(sql.contains("VALUES (?)"), sql);
            assertTrue(!sql.contains("DROP TABLE"), sql);
        }

        @Test
        @DisplayName("El numero de interrogantes coincide con el numero de valores")
        void numeroParametros() {
            String sql = solution.sentenciaInsert("t", List.of("a", "b", "c"), List.of(1, 2, 3));
            assertEquals(3, sql.chars().filter(c -> c == '?').count());
        }
    }
  explanation: |
    Un text block abre con `"""` y el contenido empieza en la linea siguiente.
    El texto del bloque conserva el sangrado *relativo* al de la comilla de
    cierre: la linea menos indentada marca el margen que se elimina de todas.

    `String.formatted` aplica un `String.format` con los `%s` en orden. En
    Spring/JPA lo habitual es usar los parametros con nombre (`:nombre`) para
    no depender del orden.

    **El punto de seguridad del ejercicio**: los valores NUNCA se concatenan en
    la cadena SQL. Van como `?` y los envia el driver. Si alguien "optimiza"
    concatenando, aparece una inyeccion SQL. Es uno de los errores que mas se
    ven en revisiones de codigo real.

- id: java-enums-001
  track: JAVA_CORE
  title: Enums con comportamiento y transiciones de estado
  difficulty: MEDIUM
  tags: [enums, state-machine, switch]
  xp: 15
  estimatedMinutes: 15
  timeLimitSeconds: 5
  solutionClass: EstadoPedido
  testClass: EstadoPedidoTest
  prompt: |
    Un enum puede tener comportamiento: cada constante tiene sus propios metodos
    y puede consultar el resto. Esto convierte al enum en una pequena maquina de
    estados, muy usada en el dominio de un pedido.

    Flujo: `PENDIENTE -> PAGADO -> ENVIADO`. `CANCELADO` no tiene siguiente.

    Tu tarea:
      1. `siguiente()`: el estado siguiente segun el flujo, `null` si no hay.
      2. `cancelable()`: true solo en `PENDIENTE` y `PAGADO`.
      3. `terminal()`: true en `ENVIADO` y `CANCELADO`.
  functionSignature: |
    public enum EstadoPedido { PENDIENTE, PAGADO, ENVIADO, CANCELADO }
  starterCode: |
    public enum EstadoPedido {

        PENDIENTE,
        PAGADO,
        ENVIADO,
        CANCELADO;

        // TODO 1: estado siguiente (PENDIENTE -> PAGADO -> ENVIADO). CANCELADO y
        // ENVIADO no tienen siguiente: devuelven null.
        public EstadoPedido siguiente() {
            throw new UnsupportedOperationException("TODO");
        }

        // TODO 2: solo PENDIENTE y PAGADO se pueden cancelar
        public boolean cancelable() {
            throw new UnsupportedOperationException("TODO");
        }

        // TODO 3: ENVIADO y CANCELADO son estados finales
        public boolean terminal() {
            throw new UnsupportedOperationException("TODO");
        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertFalse;
    import static org.junit.jupiter.api.Assertions.assertNull;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class EstadoPedidoTest {

        @Test
        @DisplayName("El flujo de estados es PENDIENTE -> PAGADO -> ENVIADO")
        void flujo() {
            assertEquals(EstadoPedido.PAGADO, EstadoPedido.PENDIENTE.siguiente());
            assertEquals(EstadoPedido.ENVIADO, EstadoPedido.PAGADO.siguiente());
            assertNull(EstadoPedido.ENVIADO.siguiente());
            assertNull(EstadoPedido.CANCELADO.siguiente());
        }

        @Test
        @DisplayName("Solo PENDIENTE y PAGADO son cancelables")
        void cancelables() {
            assertTrue(EstadoPedido.PENDIENTE.cancelable());
            assertTrue(EstadoPedido.PAGADO.cancelable());
            assertFalse(EstadoPedido.ENVIADO.cancelable());
            assertFalse(EstadoPedido.CANCELADO.cancelable());
        }

        @Test
        @DisplayName("ENVIADO y CANCELADO son finales")
        void terminales() {
            assertTrue(EstadoPedido.ENVIADO.terminal());
            assertTrue(EstadoPedido.CANCELADO.terminal());
            assertFalse(EstadoPedido.PENDIENTE.terminal());
            assertFalse(EstadoPedido.PAGADO.terminal());
        }
    }
  explanation: |
    Un enum con metodos es una forma muy compacta de expressar reglas de negocio
    sin duele. La alternativa habitual en un dominio mas rico es un enum "abierto"
    que delega en un mapa de transiciones, o directamente el patron *State* con
    una clase por estado.

    `values()` y `valueOf()` los genera el compilador. `values()` devuelve una
    copia del array en cada llamada: si se usa mucho, es un detalle de rendimiento
    a tener en cuenta.

    **En interviews**: "cuantas formas hay de modelar una maquina de estados en
    Java?" -> enum con `switch`, enum abierto con mapa de transiciones, patron
    *State*, o una libreria como Spring Statemachine. Cada una con sus trade-offs.

- id: oop-strategy-001
  track: JAVA_OOP
  title: "Patron Strategy: cambiar el algoritmo en tiempo de ejecucion"
  difficulty: MEDIUM
  tags: [strategy, solid, open-closed, patrones]
  xp: 20
  estimatedMinutes: 20
  timeLimitSeconds: 5
  solutionClass: Solution
  testClass: SolutionTest
  prompt: |
    El patron *Strategy* encapsula una familia de algoritmos intercambiables
    bajo una misma abstraccion. El cliente elige cual usar en tiempo de ejecucion
    y no cambia nunca al anadir un algoritmo nuevo: ese es el principio
    *Open/Closed* en accion.

    Tu tarea:
      1. `estrategiaPara(boolean urgente)`: devuelve la estrategia correcta.
      2. `calcular(Tarifa, int horas, double tarifaBase)`: aplica la estrategia.
