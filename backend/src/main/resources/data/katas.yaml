        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;

    import java.util.List;
    import java.util.Map;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        private final Solution solution = new Solution();

        private static List<Venta> ventas() {
            return List.of(
                    new Venta("Ana", 100.0, "PAGADO"),
                    new Venta("Luis", 80.0, "PENDIENTE"),
                    new Venta("Ana", 20.0, "PAGADO"),
                    new Venta("Marta", 50.0, "PENDIENTE"));
        }

        @Test
        @DisplayName("Suma los importes por cliente")
        void totalPorCliente() {
            Map<String, Double> result = solution.totalPorCliente(ventas());
            assertEquals(120.0, result.get("Ana"));
            assertEquals(80.0, result.get("Luis"));
            assertEquals(50.0, result.get("Marta"));
            assertEquals(3, result.size());
        }

        @Test
        @DisplayName("Una lista vacia devuelve un mapa vacio")
        void listaVacia() {
            assertEquals(Map.of(), solution.totalPorCliente(List.of()));
        }

        @Test
        @DisplayName("topClientes ordena por importe descendente")
        void topClientes() {
            assertEquals(List.of("Ana", "Luis"), solution.topClientes(ventas(), 2));
            assertEquals(List.of("Ana"), solution.topClientes(ventas(), 1));
            assertEquals(List.of("Ana", "Luis", "Marta"), solution.topClientes(ventas(), 10));
        }

        @Test
        @DisplayName("El resumen ordena alfabeticamente")
        void resumenPorCliente() {
            assertEquals("Ana:120.0, Luis:80.0, Marta:50.0", solution.resumenPorCliente(ventas()));
        }
    }
  explanation: |
    `groupingBy` + `summingDouble` es el patron estandar para agregar por clave.
    Alternativa equivalente: `Collectors.toMap(clave, valor, (a, b) -> a + b)`, que
    ademas obliga a decidir que hacer con claves duplicadas.

    Para el top-N hay dos caminos:
      - `sorted(...)` + `limit(n)`: claro, pero ordena de mas a menos.
      - `Comparator.comparingDouble(...).reversed()`: ojo con el orden de
        `reversed()`: si se encadena mal, el resultado sale al reves.

    `Collectors.joining(", ")` es lo que produce el resumen. Fijate en que el
    `Map` de `groupingBy` es un `HashMap` (orden no garantizado): para tener un
    orden estable hay que pedir `LinkedHashMap` explicitamente o ordenar despues.

- id: java-optional-001
