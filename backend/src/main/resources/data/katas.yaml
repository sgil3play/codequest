        }
    }
  testSource: |
    import static org.junit.jupiter.api.Assertions.assertEquals;
    import static org.junit.jupiter.api.Assertions.assertTrue;

    import java.util.Optional;
    import org.junit.jupiter.api.DisplayName;
    import org.junit.jupiter.api.Test;

    class SolutionTest {

        private final Solution solution = new Solution();

        @Test
        @DisplayName("emailSeguro usa el email si existe")
        void emailPresente() {
            assertEquals("ana@empresa.com", solution.emailSeguro(new Empleado("Ana", "ana@empresa.com", null)));
        }

        @Test
        @DisplayName("emailSeguro cae al valor por defecto")
        void emailAusente() {
            assertEquals("sin-email@empresa.com", solution.emailSeguro(new Empleado("Ana", null, null)));
            assertEquals("sin-email@empresa.com", solution.emailSeguro(new Empleado("Ana", "  ", null)));
        }

        @Test
        @DisplayName("nombreSupervisor devuelve empty si no hay supervisor")
        void supervisorAusente() {
            assertTrue(solution.nombreSupervisor(new Empleado("Ana", "a@e.com", null)).isEmpty());
            assertTrue(solution.nombreSupervisor(new Empleado("Ana", "a@e.com", "  ")).isEmpty());
        }

        @Test
        @DisplayName("nombreSupervisor devuelve el nombre")
        void supervisorPresente() {
            assertEquals(Optional.of("Luis"), solution.nombreSupervisor(new Empleado("Ana", "a@e.com", "Luis")));
        }

        @Test
        @DisplayName("correoCorporativo normaliza a minusculas")
        void correoCorporativo() {
            assertEquals(Optional.of("ana lopez@empresa.com"),
                    solution.correoCorporativo(new Empleado("Ana Lopez", "a@e.com", null)));
        }

        @Test
        @DisplayName("correoCorporativo queda vacio si no hay nombre")
        void correoSinNombre() {
            assertTrue(solution.correoCorporativo(new Empleado(null, "a@e.com", null)).isEmpty());
        }
    }
  explanation: |
    Las tres operaciones que hay que saber:
      - `map`: transforma el valor si lo hay. Si el `Optional` esta vacio, no
        se aplica la funcion y sigue vacio.
      - `flatMap`: como `map`, pero la funcion devuelve otro `Optional`. Evita
        el `Optional<Optional<T>>`.
      - `orElse` vs `orElseGet`: `orElse` evalua el argumento **siempre**,
        `orElseGet` solo si hace falta. Con un valor caro o con una llamada que
        lance, la diferencia importa.

    En produccion, `Optional` en la firma de un metodo de dominio expresa
    "puede que no haya resultado". En un controller, se transforma en 404 o 400
    en el borde de la aplicacion.

- id: java-textblocks-001
