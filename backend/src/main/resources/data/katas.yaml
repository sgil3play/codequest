  prompt: |
    En arquitectura hexagonal el dominio define un **puerto** (interfaz) y la
    infraestructura implementa ese puerto como **adaptador**. La regla: las
    dependencias apuntan hacia dentro. Si el servicio de aplicacion importa
    `java.sql` o `org.springframework`, la arquitectura esta rota.

    En este ejercicio, el puerto `PedidoRepository` ya esta definido. Tu tarea es
    implementar el servicio de aplicacion `totalFacturado`, que solo conoce el
    puerto.

    Ojo: el metodo NO debe recibir la implementacion concreta, sino el puerto.
  functionSignature: |
    double totalFacturado(String cliente, PedidoRepository repository)
  starterCode: |
    import java.util.List;

    /**
     * Puerto de salida del dominio. Define QUE se necesita, no COMO se resuelve.
     */
    interface PedidoRepository {
        List<Pedido> findByCliente(String cliente);
    }

    /** Entidad de dominio. */
    record Pedido(String id, String cliente, double total) {}

    /**
     * Adaptador: implementacion en memoria del puerto. En produccion habria
     * otro adaptador backed por JPA o por una API externa.
     */
    class PedidoRepositoryInMemory implements PedidoRepository {
        private final List<Pedido> pedidos;

        PedidoRepositoryInMemory(List<Pedido> pedidos) {
            this.pedidos = List.copyOf(pedidos);
        }

        @Override
        public List<Pedido> findByCliente(String cliente) {
            return pedidos.stream().filter(p -> p.cliente().equals(cliente)).toList();
        }
    }

    public class Solution {

        /**
         * TODO: servicio de aplicacion. Solo debe depender del puerto
         * PedidoRepository, nunca de PedidoRepositoryInMemory.
         */
