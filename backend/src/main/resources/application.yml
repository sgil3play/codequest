server:
  port: 8080
  error:
    # El GlobalExceptionHandler ya devuelve un mensaje propio y controlado.
    # La pagina de error por defecto de Spring no debe filtrar mensajes internos.
    include-message: never

spring:
  application:
    name: codequest
  datasource:
    # H2 en memoria: el progreso vive mientras dure el proceso.
    # Sustituir por Postgres/Oracle solo exige cambiar esta URL y el driver.
    url: jdbc:h2:mem:codequest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      # La consola H2 permite ejecutar SQL arbitrario y, con CREATE ALIAS, Java
      # dentro del proceso del servidor. Es una superficie de ejecucion de
      # codigo sin autenticar, asi que queda desactivada por defecto y solo
      # se activa de forma explicita con el perfil "local".
      enabled: false
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # show-details: always filtra la ruta del directorio de trabajo y el
      # tamano de disco. Para depurar en local se activa con el perfil "local".
      show-details: never

# ---------------------------------------------------------------------------
# Perfil de desarrollo local: habilita la consola H2 y el detalle del health.
# Se activa con --spring.profiles.active=local
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

codequest:
  runner:
    # Limite por caso cuando el reto no define el suyo en el catalogo.
    default-timeout-seconds: 5
    compile-timeout-seconds: 20
    # Red de seguridad: si el codigo ignora la interrupcion, el proceso hijo
    # se mata aqui.
    global-timeout-seconds: 60
    # Entregas simultaneas: cada una lanza un javac y una JVM hija.
    max-concurrent: 4
    max-output-bytes: 262144

logging:
  level:
    com.codequest: INFO
