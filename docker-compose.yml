# CodeQuest completo: backend Spring Boot + frontend Angular servido por nginx.
#
#   docker compose up --build
#
# La aplicacion queda en http://localhost:4200 y la API en
# http://localhost:8080 (tambien accesible desde fuera del compose).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: codequest-backend
    container_name: codequest-backend
    ports:
      - "8080:8080"
    environment:
      # La base de datos por defecto es H2 en memoria: el progreso vive
      # mientras dure el contenedor.
      SPRING_DATASOURCE_URL: jdbc:h2:mem:codequest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # El detalle del health queda en "never" (ver application.yml): filtrar
      # la ruta del contenedor no aporta nada y no debe viajar en la respuesta.
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # Limite de ejecuciones de codigo simultaneas en el backend.
      CODEQUEST_RUNNER_MAX_CONCURRENT: 4
    # El runner compila y ejecuta codigo en procesos hijo: sin limites de CPU
    # ni de memoria, unas cuantas entregas simultaneas pueden tumbar el host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: codequest-frontend
    container_name: codequest-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
