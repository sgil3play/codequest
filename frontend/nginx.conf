# Configuracion de nginx para el frontend de CodeQuest.
#
# Sirve los ficheros estaticos que genera Angular y redirige las llamadas a
# la API al backend. El frontend siempre habla con rutas relativas, asi que en
# produccion el mismo origen sirve los dos.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API va al backend. El nombre "backend" es el del servicio en
    # docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La ejecucion de un reto puede tardar varios segundos (compilar y
        # ejecutar la suite), asi que el timeout por defecto de nginx se queda
        # corto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # La documentacion de la API tambien cuelga del backend.
    location ~ ^/(actuator|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Una SPA con enrutado en el cliente: cualquier ruta desconocida devuelve
    # el index.html para que el router de Angular resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html no se cachea: es quien apunta a los bundles con hash.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
